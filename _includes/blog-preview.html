<!-- =========================================================
     SECÇÃO NOVIDADES
     ---------------------------------------------------------
     Nesta versão, o cartão inteiro funciona como link
     para o respetivo post.

     Vantagem:
     o comportamento visual do hover passa a corresponder
     ao comportamento funcional do cartão.
========================================================= -->

<section id="blog">
  <div class="container">
    <h2>Novidades</h2>
    <p class="subtitle">
      Fique por dentro das atualizações, projetos e conteúdos
      mais recentes.
    </p>

    <div class="card-grid">
      {% for post in site.posts limit:3 %}
        <!-- -------------------------------------------------
             CARTÃO-POST COMPLETAMENTE CLICÁVEL
             -------------------------------------------------
             O link envolve todo o cartão.
        -------------------------------------------------- -->
        <a href="{{ post.url | relative_url }}" class="card">
          <p class="post-date">{{ post.date | date: "%d/%m/%Y" }}</p>

          <h3>{{ post.title }}</h3>

          <p class="post-excerpt">
            {{ post.content | strip_html | truncatewords: 20 }}
          </p>

          {% if post.image %}
            <img
              src="{{ post.image }}"
              alt="{{ post.title }}"
              class="post-thumb"
            >
          {% endif %}
        </a>
      {% endfor %}
    </div>
  </div>
</section>
